[project]
name = "klimate-ingest"
version = "0.2.0a0"
description = "Klimate Kundli v0.2 ingest workers: pull, transform, and aggregate climate data into the serving DB."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "cdsapi>=0.7.5",
  "xarray>=2024.1.0",
  "cfgrib>=0.9.10",
  "netcdf4>=1.6.5",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "duckdb>=1.0",
  "psycopg[binary]>=3.2",
  "boto3>=1.34",
  "click>=8.1",
  "tenacity>=8.5",
  "structlog>=24.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pytest>=8.2",
  "pytest-cov>=5.0",
]

[project.scripts]
klimate-ingest = "klimate_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klimate_ingest"]

[tool.ruff]
line-length = 100
target-version = "py311"
